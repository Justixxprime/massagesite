name = "amara-vale-gallery"
main = "index.js"
compatibility_date = "2026-01-01"

# Optional: restrict CORS to your real domain once deployed.
# [vars]
# ALLOWED_ORIGIN = "https://www.amaravale.com"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "amara-vale-media"

# Used for brute-force password lockout (5 wrong tries = 15 min lock)
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
